<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QNT - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .login-form {
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

<body>
    <!-- Header (navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="#">QNT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="#">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Hỗ trợ</a></li>
            </ul>
            <div class="d-flex">
                <a class="nav-link text-white me-3 mt-1" href="#">Đăng nhập</a>
                <a class="btn btn-light fw-bold" href="#">Mở QNT</a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="login-container">
        <div class="login-form">
            <h2 class="text-center mb-4">Chào mừng trở lại</h2>
            <p class="text-center text-muted mb-4">Rất vui mừng khi gặp lại bạn</p>
            <form>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email hoặc số điện thoại">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Mật khẩu">
                </div>
                <div class="mb-3">
                    <a href="#" class="text-decoration-none text-primary">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Đăng nhập</button>
                <p class="text-center mb-0">
                    Cần một tài khoản? <a href="#" class="text-decoration-none text-primary">Đăng ký</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Footer -->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
