<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QNT - Server Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: #2f3136!important;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar trái -->
        <div class="sidebar d-flex flex-column align-items-center py-3">
            <div class="server-item">
                <a href="chat.html">
                    <img src="assets/img/user1.jpg" class="profile-img align-items-center">
                </a>
            </div>
            <div class="server-item">
                <img src="assets/img/user3.jpg" class="profile-img align-items-center" />
            </div>
            <div class="server-item">
                <a href="chatServer.html">
                    <img src="assets/img/user4.jpg" class="profile-img align-items-center">
                </a>
            </div>
            <div class="server-item">
                <img src="assets/img/user2.jpg" class="profile-img align-items-center" />
            </div>
            <div class="server-item">+</div>
            <div class="server-item"><i class="bi bi-compass-fill"></i></div>
            <div class="server-item"><i class="bi bi-download"></i></div>
        </div>
        <!-- Server channels sidebar -->
        <div class="server-channels pe-3">
            <h6 class="text-white mb-3">Máy chủ của Test</h6>

            <div class="channel-category">
                <i class="bi bi-chevron-down"></i> Kênh Chat
            </div>
            <div class="channel-item active">
                <i class="bi bi-hash me-2"></i> Chung
            </div>
            <div class="channel-item">
                <i class="bi bi-hash me-2"></i> Trò chơi
            </div>
            <div class="channel-item">
                <i class="bi bi-music-note me-2"></i> Âm nhạc
            </div>

            <div class="channel-category">
                <i class="bi bi-chevron-down"></i> Kênh Thoại
            </div>
            <div class="channel-item">
                <i class="bi bi-volume-up me-2"></i> Phòng Chờ
            </div>
            <a href="phoneServer.html">
                <div class="channel-item">
                    <i class="bi bi-camera-video me-2"></i> Phòng Stream
                </div>
            </a>
        </div>

        <!-- Chat area -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="d-flex align-items-center">
                    <i class="bi bi-hash me-2"></i>
                    <span>Chung</span>
                </div>
            </div>
            <div class="chat-body">
                <!-- Messages will appear here -->
            </div>
            <div class="chat-footer d-flex align-items-center p-3">
                <div class="input-group">
                    <input type="text" class="form-control chat-input" placeholder="Nhắn tin #chung">
                    <button class="btn btn-dark">
                        <i class="bi bi-image"></i>
                    </button>
                    <button class="btn btn-dark">
                        <i class="bi bi-filetype-gif"></i>
                    </button>
                    <button class="btn btn-dark">
                        <i class="bi bi-emoji-smile-fill"></i>
                    </button>
                    <button class="btn btn-dark">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Members list -->
        <div class="members-list pe-5">
            <div class="member-category">TRỰC TUYẾN - 1</div>
            <div class="member-item">
                <img src="assets/img/user1.jpg" class="profile-img me-2" />
                <span class="text-white">Võ Minh Tài</span>
            </div>

            <div class="member-category">KHÔNG LÀM PHIỀN - 1</div>
            <div class="member-item">
                <img src="assets/img/user2.jpg" class="profile-img me-2" />
                <span class="text-white">Trần Uy Nghĩa</span>
            </div>

            <div class="member-category">NGOẠI TUYẾN - 1</div>
            <div class="member-item">
                <img src="assets/img/user3.jpg" class="profile-img me-2" />
                <span class="text-white">Dương Lê Minh Quang</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
